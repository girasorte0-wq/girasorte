<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registo e Acesso — Gira Itararé</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0a1929;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.container{background:#132f4c;padding:30px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.3);width:100%;max-width:400px;}
h1{text-align:center;color:#4dabf7;margin-bottom:20px;font-size:24px;}

.abas{display:flex;gap:10px;margin-bottom:20px;}
.aba-btn{flex:1;padding:10px;background:#0a1929;border:none;border-radius:6px;color:#94a3b8;font-weight:bold;cursor:pointer;font-size:15px;}
.aba-btn.ativa{background:#228be6;color:#fff;}

input{width:100%;padding:12px;margin-bottom:15px;border:none;border-radius:6px;background:#0a1929;color:#fff;font-size:16px;outline:none;}
input:focus{border:1px solid #4dabf7;}

button.btn-acao{width:100%;padding:14px;background:#228be6;border:none;border-radius:6px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;transition:background 0.3s;}
button.btn-acao:hover{background:#1c7ed6;}

.erro{color:#ff6b6b;background:rgba(255,107,107,0.1);padding:10px;border-radius:6px;margin-bottom:15px;text-align:center;display:none;font-size:14px;border-left:3px solid #ff6b6b;}
.sucesso{color:#51cf66;background:rgba(81,207,102,0.1);padding:10px;border-radius:6px;margin-bottom:15px;text-align:center;display:none;font-size:14px;border-left:3px solid #51cf66;}
.carregando{text-align:center;color:#4dabf7;margin-top:15px;display:none;}
.esconder{display:none !important;}
</style>
</head>
<body>
<div class="container">
<h1>🎱 Gira Itararé</h1>

<div class="abas">
  <button class="aba-btn ativa" id="btnAbaLogin" onclick="mudarPainel('login')">Entrar</button>
  <button class="aba-btn" id="btnAbaCadastro" onclick="mudarPainel('cadastro')">Criar Conta</button>
</div>

<div class="erro" id="msgErro"></div>
<div class="sucesso" id="msgSucesso"></div>

<!-- PAINEL DE LOGIN -->
<div id="painelLogin">
  <input type="tel" id="loginWhatsapp" placeholder="Seu WhatsApp com DDD" maxlength="15">
  <input type="password" id="loginSenha" placeholder="Sua senha">
  <button class="btn-acao" onclick="fazerLogin()">Entrar</button>
</div>

<!-- PAINEL DE CADASTRO -->
<div id="painelCadastro" class="esconder">
  <input type="text" id="cadNome" placeholder="Seu nome completo">
  <input type="tel" id="cadWhatsapp" placeholder="Seu WhatsApp com DDD" maxlength="15">
  <input type="password" id="cadSenha" placeholder="Crie uma senha (mínimo 6 dígitos)">
  <button class="btn-acao" onclick="fazerCadastro()">Registar Conta</button>
</div>

<div class="carregando" id="carregando">Processando...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB7DaddpD-6vqmbXXXXXXXXXXXXXXXX",
  authDomain: "gira-sorte.firebaseapp.com",
  databaseURL: "https://gira-sorte-default-rtdb.firebaseio.com",
  projectId: "gira-sorte",
  storageBucket: "gira-sorte.appspot.com",
  messagingSenderId: "886050266980",
  appId: "1:886050266980:web:b1bbd1bb09daecd4c2e471"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function mudarPainel(tipo) {
  esconderMensagens();
  if(tipo === 'login') {
    document.getElementById('painelLogin').classList.remove('esconder');
    document.getElementById('painelCadastro').classList.add('esconder');
    document.getElementById('btnAbaLogin').classList.add('ativa');
    document.getElementById('btnAbaCadastro').classList.remove('ativa');
  } else {
    document.getElementById('painelLogin').classList.add('esconder');
    document.getElementById('painelCadastro').classList.remove('esconder');
    document.getElementById('btnAbaCadastro').classList.add('ativa');
    document.getElementById('btnAbaLogin').classList.remove('ativa');
  }
}

function mostrarErro(txt) {
  const el = document.getElementById('msgErro');
  el.textContent = txt;
  el.style.display = 'block';
  document.getElementById('msgSucesso').style.display = 'none';
}

function mostrarSucesso(txt) {
  const el = document.getElementById('msgSucesso');
  el.textContent = txt;
  el.style.display = 'block';
  document.getElementById('msgErro').style.display = 'none';
}

function esconderMensagens() {
  document.getElementById('msgErro').style.display = 'none';
  document.getElementById('msgSucesso').style.display = 'none';
}

async function fazerCadastro() {
  const nome = document.getElementById('cadNome').value.trim();
  const whatsapp = document.getElementById('cadWhatsapp').value.trim().replace(/\D/g, '');
  const senha = document.getElementById('cadSenha').value;
  const carregando = document.getElementById('carregando');

  esconderMensagens();

  if (!nome || !whatsapp || !senha) {
    mostrarErro('Preencha todos os campos!');
    return;
  }

  if (senha.length < 6) {
    mostrarErro('A senha deve ter pelo menos 6 caracteres.');
    return;
  }

  carregando.style.display = 'block';

  try {
    const usuarioRef = db.ref('usuarios/' + whatsapp);
    const snapshot = await usuarioRef.once('value');

    // Validação estrita para evitar contas duplicadas com o mesmo WhatsApp
    if (snapshot.exists()) {
      carregando.style.display = 'none';
      mostrarErro('Este número de WhatsApp já se encontra registado!');
      return;
    }

    // Cria o novo utilizador com status pendente de aprovação do administrador
    const novoUsuario = {
      nome,
      whatsapp,
      senha,
      saldo: 0,
      girosRoleta: 0,
      status: 'pendente',
      dataCadastro: new Date().toISOString()
    };

    await usuarioRef.set(novoUsuario);
    carregando.style.display = 'none';
    mostrarSucesso('Conta criada com sucesso! Aguarde a aprovação do administrador.');

    setTimeout(() => {
      mudarPainel('login');
    }, 3000);

  } catch (error) {
    carregando.style.display = 'none';
    mostrarErro('Erro ao ligar à base de dados: ' + error.message);
  }
}

async function fazerLogin() {
  const whatsapp = document.getElementById('loginWhatsapp').value.trim().replace(/\D/g, '');
  const senha = document.getElementById('loginSenha').value;
  const carregando = document.getElementById('carregando');

  esconderMensagens();

  if (!whatsapp || !senha) {
    mostrarErro('Insira o seu WhatsApp e senha!');
    return;
  }

  carregando.style.display = 'block';

  try {
    const snapshot = await db.ref('usuarios/' + whatsapp).once('value');
    carregando.style.display = 'none';

    if (!snapshot.exists()) {
      mostrarErro('Utilizador não encontrado com este WhatsApp.');
      return;
    }

    const dados = snapshot.val();

    if (dados.senha !== senha) {
      mostrarErro('Senha incorreta! Verifique os seus dados.');
      return;
    }

    if (dados.status !== 'aprovado') {
      mostrarErro('A sua conta ainda está pendente de aprovação pelo administrador.');
      return;
    }

    // Guarda os dados na sessão e redireciona para o painel do jogador
    localStorage.setItem('bingo_usuario', JSON.stringify({
      nome: dados.nome,
      whatsapp: dados.whatsapp,
      saldo: dados.saldo || 0
    }));

    window.location.href = 'jogador.html';

  } catch (error) {
    carregando.style.display = 'none';
    mostrarErro('Erro ao efetuar login: ' + error.message);
  }
}
</script>
</body>
</html>
